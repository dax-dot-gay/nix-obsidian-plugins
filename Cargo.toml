[package]
name = "nix-obsidian-plugins"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
bytes = { version = "1.11.1", features = ["serde", "std"] }
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive", "cargo", "env"] }
flate2 = "1.1.9"
handlebars = { version = "6.4.0", features = ["dir_source", "heck", "string_helpers"] }
http = "1.4.0"
http-body-util = "0.1.3"
octocrab = "0.49.7"
rand = "0.10.1"
reqwest = { version = "0.13.2", features = ["json"] }
rustls = "0.23.38"
semver = { version = "1.0.28", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tar = "0.4.45"
tempfile = "3.27.0"
thiserror = "2.0.18"
tokio = { version = "1.52.1", features = ["full"] }
